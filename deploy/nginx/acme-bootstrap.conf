# Temporary HTTP-only config used solely to issue the initial SAN certificate.
# Remove this file after certbot succeeds, then install lidex.conf.
server {
    listen 80;
    listen [::]:80;
    server_name lidex.tech explorer.lidex.tech rpc.lidex.tech ws.lidex.tech
                testnet.lidex.tech testnet-rpc.lidex.tech docs.lidex.tech;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/letsencrypt;
        try_files $uri =404;
    }

    location / { return 404; }
}
