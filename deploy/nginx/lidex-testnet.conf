# Nginx reverse proxy for LIDEX public Testnet.
#
# Install: /etc/nginx/conf.d/lidex-testnet.conf (inside nginx http block)
# Then:    nginx -t && systemctl reload nginx
#
# Public Testnet endpoints (TLS-terminated here, all backends loopback only):
#   rpc-testnet.lidex.tech   -> JSON-RPC (POST /) via public gateway
#   ws-testnet.lidex.tech    -> WebSocket (/ws) via public gateway
#   api-testnet.lidex.tech   -> REST API gateway (POST /, GET /network.json, GET /health)
#   explorer-testnet.lidex.tech -> Explorer static app + /network.json via gateway
#
# Consensus/P2P ports (26656, 26657, 26658) and the ABCI RPC port (7302) are
# loopback-only and are never proxied publicly. The public gateway (8080) is
# also loopback-only; nginx is the single public entry point.
#
# All locations return 503 until the corresponding service passes its release
# gate. Do not flip enablement to 1 until chain ID, genesis, and validator
# mappings are approved and CometBFT interop is verified.

server_tokens off;

map $http_origin $lidex_testnet_cors_origin {
    default "";
    "https://rpc-testnet.lidex.tech" $http_origin;
    "https://ws-testnet.lidex.tech" $http_origin;
    "https://api-testnet.lidex.tech" $http_origin;
    "https://explorer-testnet.lidex.tech" $http_origin;
}

map $http_origin $lidex_testnet_ws_origin_ok {
    default 0;
    "" 1;
    "https://rpc-testnet.lidex.tech" 1;
    "https://ws-testnet.lidex.tech" 1;
    "https://api-testnet.lidex.tech" 1;
    "https://explorer-testnet.lidex.tech" 1;
}

map $host $lidex_testnet_rpc_enabled {
    default 0;
    rpc-testnet.lidex.tech 0;
    api-testnet.lidex.tech 0;
}

map $host $lidex_testnet_ws_enabled {
    default 0;
    ws-testnet.lidex.tech 0;
}

map $host $lidex_testnet_explorer_enabled {
    default 0;
    explorer-testnet.lidex.tech 0;
}

map $http_upgrade $connection_upgrade {
    default upgrade;
    "" close;
}

limit_req_zone $binary_remote_addr zone=lidex_testnet_rpc:10m rate=20r/s;
limit_conn_zone $binary_remote_addr zone=lidex_testnet_ws:10m;

# Catch-all: deny everything not explicitly served.
server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name _;
    return 444;
}

server {
    listen 443 ssl default_server;
    listen [::]:443 ssl default_server;
    server_name _;
    ssl_certificate /etc/letsencrypt/live/lidex.tech/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/lidex.tech/privkey.pem;
    return 444;
}

# HTTP -> HTTPS redirect + ACME challenges on port 80.
server {
    listen 80;
    listen [::]:80;
    server_name rpc-testnet.lidex.tech ws-testnet.lidex.tech
                api-testnet.lidex.tech explorer-testnet.lidex.tech;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/letsencrypt;
        try_files $uri =404;
    }

    location / {
        return 308 https://$host$request_uri;
    }
}

# --- rpc-testnet.lidex.tech : JSON-RPC endpoint -----------------------------
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name rpc-testnet.lidex.tech;

    ssl_certificate /etc/letsencrypt/live/lidex.tech/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/lidex.tech/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_timeout 1d;
    ssl_session_cache shared:TLS:10m;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;

    location = / {
        if ($request_method = OPTIONS) { return 204; }
        if ($request_method != POST) { return 405; }
        if ($lidex_testnet_rpc_enabled = 0) { return 503; }
        limit_req zone=lidex_testnet_rpc burst=40 nodelay;
        client_max_body_size 12m;
        proxy_pass http://127.0.0.1:8080/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_hide_header Access-Control-Allow-Origin;
        add_header Access-Control-Allow-Origin $lidex_testnet_cors_origin always;
        add_header Access-Control-Allow-Methods "POST, OPTIONS" always;
        add_header Access-Control-Allow-Headers "Content-Type" always;
        add_header Vary Origin always;
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
        add_header X-Content-Type-Options nosniff always;
        add_header Referrer-Policy strict-origin-when-cross-origin always;
    }

    location / { return 404; }
}

# --- ws-testnet.lidex.tech : WebSocket endpoint ------------------------------
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name ws-testnet.lidex.tech;

    ssl_certificate /etc/letsencrypt/live/lidex.tech/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/lidex.tech/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_timeout 1d;
    ssl_session_cache shared:TLS:10m;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;

    location = /ws {
        if ($lidex_testnet_ws_origin_ok = 0) { return 403; }
        if ($lidex_testnet_ws_enabled = 0) { return 503; }
        limit_conn lidex_testnet_ws 20;
        proxy_pass http://127.0.0.1:8080/ws;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_read_timeout 1h;
        proxy_send_timeout 1h;
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
        add_header X-Content-Type-Options nosniff always;
        add_header Referrer-Policy strict-origin-when-cross-origin always;
    }

    location / { return 404; }
}

# --- api-testnet.lidex.tech : REST API gateway --------------------------------
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name api-testnet.lidex.tech;

    ssl_certificate /etc/letsencrypt/live/lidex.tech/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/lidex.tech/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_timeout 1d;
    ssl_session_cache shared:TLS:10m;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;

    location = / {
        if ($request_method = OPTIONS) { return 204; }
        if ($request_method != POST) { return 405; }
        if ($lidex_testnet_rpc_enabled = 0) { return 503; }
        limit_req zone=lidex_testnet_rpc burst=40 nodelay;
        client_max_body_size 12m;
        proxy_pass http://127.0.0.1:8080/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_hide_header Access-Control-Allow-Origin;
        add_header Access-Control-Allow-Origin $lidex_testnet_cors_origin always;
        add_header Access-Control-Allow-Methods "POST, OPTIONS" always;
        add_header Access-Control-Allow-Headers "Content-Type" always;
        add_header Vary Origin always;
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
        add_header X-Content-Type-Options nosniff always;
        add_header Referrer-Policy strict-origin-when-cross-origin always;
    }

    location = /network.json {
        limit_except GET HEAD { deny all; }
        if ($lidex_testnet_rpc_enabled = 0) { return 503; }
        proxy_pass http://127.0.0.1:8080/network.json;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
        add_header X-Content-Type-Options nosniff always;
        add_header Referrer-Policy strict-origin-when-cross-origin always;
    }

    location = /health {
        limit_except GET HEAD { deny all; }
        proxy_pass http://127.0.0.1:8080/health;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
        add_header X-Content-Type-Options nosniff always;
        add_header Referrer-Policy strict-origin-when-cross-origin always;
    }

    location / { return 404; }
}

# --- explorer-testnet.lidex.tech : Explorer + network descriptor --------------
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name explorer-testnet.lidex.tech;

    ssl_certificate /etc/letsencrypt/live/lidex.tech/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/lidex.tech/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_timeout 1d;
    ssl_session_cache shared:TLS:10m;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;

    root /srv/lidex/testnet/explorer;
    index index.html;

    location = / {
        if ($request_method !~ ^(GET|HEAD)$) { return 405; }
        if ($lidex_testnet_explorer_enabled = 0) { return 503; }
        try_files /index.html =503;
    }

    location = /network.json {
        limit_except GET HEAD { deny all; }
        if ($lidex_testnet_explorer_enabled = 0) { return 503; }
        proxy_pass http://127.0.0.1:8080/network.json;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
        add_header X-Content-Type-Options nosniff always;
        add_header Referrer-Policy strict-origin-when-cross-origin always;
    }

    location / {
        if ($request_method = POST) { return 503; }
        limit_except GET HEAD { deny all; }
        try_files $uri $uri/ =404;
    }
}
