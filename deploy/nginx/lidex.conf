# Install in /etc/nginx/conf.d/lidex.conf (included inside nginx's http block).
# Chain APIs intentionally return 503 until the corresponding isolated network
# and public API gateway pass their release gates.
server_tokens off;

map $http_origin $lidex_mainnet_cors_origin {
    default "";
    "https://lidex.tech" $http_origin;
    "https://explorer.lidex.tech" $http_origin;
}

map $http_origin $lidex_testnet_cors_origin {
    default "";
    "https://testnet.lidex.tech" $http_origin;
}

map $http_origin $lidex_mainnet_ws_origin_ok {
    default 0;
    "" 1;
    "https://lidex.tech" 1;
    "https://explorer.lidex.tech" 1;
}

map $http_origin $lidex_testnet_ws_origin_ok {
    default 0;
    "" 1;
    "https://testnet.lidex.tech" 1;
}

map $host $lidex_mainnet_rpc_enabled {
    default 0;
    rpc.lidex.tech 0;
}

map $host $lidex_mainnet_ws_enabled {
    default 0;
    ws.lidex.tech 0;
}

map $host $lidex_mainnet_explorer_enabled {
    default 0;
    lidex.tech 0;
    explorer.lidex.tech 0;
}

map $host $lidex_testnet_rpc_enabled {
    default 0;
    testnet-rpc.lidex.tech 0;
}

map $host $lidex_testnet_ws_enabled {
    default 0;
    testnet-rpc.lidex.tech 0;
}

map $http_upgrade $connection_upgrade {
    default upgrade;
    "" close;
}

limit_req_zone $binary_remote_addr zone=lidex_rpc:10m rate=20r/s;
limit_conn_zone $binary_remote_addr zone=lidex_ws:10m;

server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name _;
    return 444;
}

server {
    listen 443 ssl default_server;
    listen [::]:443 ssl default_server;
    server_name _;
    ssl_certificate /etc/letsencrypt/live/lidex.tech/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/lidex.tech/privkey.pem;
    return 444;
}

upstream lidex_mainnet_api {
    server 127.0.0.1:7301;
    keepalive 32;
}

upstream lidex_testnet_api {
    server 127.0.0.1:7302;
    keepalive 32;
}

upstream lidex_mainnet_ws {
    server 127.0.0.1:7301;
}

upstream lidex_testnet_ws {
    server 127.0.0.1:7302;
}

server {
    listen 80;
    listen [::]:80;
    server_name lidex.tech explorer.lidex.tech rpc.lidex.tech ws.lidex.tech
                testnet.lidex.tech testnet-rpc.lidex.tech docs.lidex.tech;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/letsencrypt;
        try_files $uri =404;
    }

    location / {
        return 308 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name lidex.tech;

    ssl_certificate /etc/letsencrypt/live/lidex.tech/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/lidex.tech/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_timeout 1d;
    ssl_session_cache shared:TLS:10m;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;

    root /srv/lidex/current/web;
    index index.html;
    location = / {
        if ($request_method !~ ^(GET|HEAD|POST)$) { return 405; }
        if ($request_method = POST) { return 418; }
        try_files /index.html =503;
    }
    error_page 418 = @mainnet_site_rpc;
    location = /network.json {
        if ($lidex_mainnet_explorer_enabled = 0) { return 503; }
        proxy_pass http://lidex_mainnet_api/network.json;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
        add_header X-Content-Type-Options nosniff always;
        add_header Referrer-Policy strict-origin-when-cross-origin always;
    }
    location @mainnet_site_rpc {
        if ($lidex_mainnet_explorer_enabled = 0) { return 503; }
        limit_req zone=lidex_rpc burst=40 nodelay;
        client_max_body_size 12m;
        proxy_pass http://lidex_mainnet_api;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_hide_header Access-Control-Allow-Origin;
        add_header Access-Control-Allow-Origin $lidex_mainnet_cors_origin always;
        add_header Vary Origin always;
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
        add_header X-Content-Type-Options nosniff always;
        add_header Referrer-Policy strict-origin-when-cross-origin always;
    }
    location / {
        limit_except GET HEAD { deny all; }
        try_files $uri $uri/ =404;
    }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name explorer.lidex.tech;

    ssl_certificate /etc/letsencrypt/live/lidex.tech/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/lidex.tech/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_timeout 1d;
    ssl_session_cache shared:TLS:10m;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;

    root /srv/lidex/current/web;
    index index.html;
    location = / {
        if ($request_method !~ ^(GET|HEAD|POST)$) { return 405; }
        if ($request_method = POST) { return 418; }
        try_files /index.html =503;
    }
    error_page 418 = @mainnet_explorer_rpc;
    location = /network.json {
        limit_except GET HEAD { deny all; }
        if ($lidex_mainnet_explorer_enabled = 0) { return 503; }
        proxy_pass http://lidex_mainnet_api/network.json;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
        add_header X-Content-Type-Options nosniff always;
        add_header Referrer-Policy strict-origin-when-cross-origin always;
    }
    location = /ws {
        if ($lidex_mainnet_ws_origin_ok = 0) { return 403; }
        return 503;
    }
    location @mainnet_explorer_rpc {
        if ($lidex_mainnet_explorer_enabled = 0) { return 503; }
        limit_req zone=lidex_rpc burst=40 nodelay;
        client_max_body_size 12m;
        proxy_pass http://lidex_mainnet_api;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_hide_header Access-Control-Allow-Origin;
        add_header Access-Control-Allow-Origin $lidex_mainnet_cors_origin always;
        add_header Vary Origin always;
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
        add_header X-Content-Type-Options nosniff always;
        add_header Referrer-Policy strict-origin-when-cross-origin always;
    }
    location / {
        if ($request_method = POST) { return 503; }
        limit_except GET HEAD { deny all; }
        try_files $uri $uri/ =404;
    }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name rpc.lidex.tech;

    ssl_certificate /etc/letsencrypt/live/lidex.tech/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/lidex.tech/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_timeout 1d;
    ssl_session_cache shared:TLS:10m;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Content-Type-Options nosniff always;

    location = / {
        if ($request_method = OPTIONS) { return 204; }
        if ($request_method != POST) { return 405; }
        if ($lidex_mainnet_rpc_enabled = 0) { return 503; }
        limit_req zone=lidex_rpc burst=40 nodelay;
        client_max_body_size 12m;
        proxy_pass http://lidex_mainnet_api/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_hide_header Access-Control-Allow-Origin;
        add_header Access-Control-Allow-Origin $lidex_mainnet_cors_origin always;
        add_header Access-Control-Allow-Methods "POST, OPTIONS" always;
        add_header Access-Control-Allow-Headers "Content-Type" always;
        add_header Vary Origin always;
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
        add_header X-Content-Type-Options nosniff always;
        add_header Referrer-Policy strict-origin-when-cross-origin always;
    }
    location / { return 404; }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name ws.lidex.tech;

    ssl_certificate /etc/letsencrypt/live/lidex.tech/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/lidex.tech/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_timeout 1d;
    ssl_session_cache shared:TLS:10m;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Content-Type-Options nosniff always;

    location = /ws {
        if ($lidex_mainnet_ws_origin_ok = 0) { return 403; }
        if ($lidex_mainnet_ws_enabled = 0) { return 503; }
        limit_conn lidex_ws 20;
        proxy_pass http://lidex_mainnet_ws/ws;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Host $host;
        proxy_read_timeout 1h;
        proxy_send_timeout 1h;
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
        add_header X-Content-Type-Options nosniff always;
        add_header Referrer-Policy strict-origin-when-cross-origin always;
    }
    location / { return 404; }
}

